<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%231e3a4c'/><path d='M6 24L16 6l10 18z' fill='%237cf'/></svg>" />
<title>武昌区 3D 地图 · Wuchang District 3D Map</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#9fb7c8; font-family: "Microsoft YaHei", system-ui, sans-serif; }
  #app { position:fixed; inset:0; }
  #hud { position:fixed; left:12px; top:12px; width:260px; max-height:calc(100vh - 48px); overflow-y:auto; background:rgba(20,28,38,.82); color:#e8eef4; padding:10px 12px; border-radius:8px; font-size:12px; line-height:1.55; backdrop-filter: blur(4px); user-select:none; }
  #hud.collapsed { width:auto; padding:6px 10px; overflow:visible; }
  #hud.collapsed #hudBody { display:none; }
  .hud-head { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  #hud.collapsed .hud-head { margin-bottom:0; }
  #hud h1 { font-size:14px; margin:0; }
  .hud-head { margin-bottom:6px; }
  #hudToggle { background:rgba(255,255,255,.12); color:#e8eef4; border:1px solid rgba(255,255,255,.22); border-radius:4px; padding:1px 7px; font-size:12px; line-height:1.4; cursor:pointer; }
  #hudToggle:hover { background:rgba(119,204,255,.28); border-color:#7cf; }
  @media (max-width: 640px) { #hint { display:none; } #attr { font-size:10px; } }
  #hud label { display:block; cursor:pointer; }
  #hud input[type=range] { width:100%; }
  #hud select, #hud input[type=text] { width:100%; box-sizing:border-box; margin:2px 0 6px; padding:3px 5px; border-radius:4px; border:1px solid #456; background:#19232e; color:#e8eef4; }
  #info { position:fixed; right:12px; top:12px; max-width:300px; background:rgba(20,28,38,.85); color:#e8eef4; padding:10px 12px; border-radius:8px; font-size:12px; display:none; }
  #hint { position:fixed; left:12px; bottom:12px; color:#fff; text-shadow:0 0 4px #000; font-size:12px; pointer-events:none; }
  #attr { position:fixed; right:10px; bottom:6px; color:#fff; text-shadow:0 0 3px #000; font-size:11px; pointer-events:none; }
  #loading { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#18222c; color:#cfe; font-size:16px; z-index:10; flex-direction:column; gap:8px; }
  #results { max-height:140px; overflow:auto; }
  #results div { cursor:pointer; padding:2px 4px; border-radius:3px; } #results div:hover { background:rgba(119,204,255,.18); color:#7cf; }
  .qjump { display:flex; flex-wrap:wrap; gap:4px; margin:4px 0 6px; }
  .qjump button { background:rgba(255,255,255,.1); color:#dce8f2; border:1px solid rgba(255,255,255,.18); border-radius:4px; padding:2px 6px; font-size:11px; cursor:pointer; }
  .qjump button:hover { background:rgba(119,204,255,.28); border-color:#7cf; }
</style>
</head>
<body>
<div id="loading"><div>武昌区 3D 地图加载中…</div><div id="lmsg" style="font-size:12px;opacity:.7"></div></div>
<div id="app"></div>
<div id="hud">
  <div class="hud-head">
    <h1>武昌区 3D · Wuchang</h1>
    <button id="hudToggle" type="button" title="收起/展开面板">－</button>
  </div>
  <div id="hudBody">
  <label>画质 Quality
    <select id="quality"><option value="low">低 Low</option><option value="med" selected>中 Medium</option><option value="high">高 High</option></select>
  </label>
  <label>底图 Basemap
    <select id="basemap"><option value="hybrid" selected>卫星+矢量 Hybrid</option><option value="sat">纯卫星 Satellite</option><option value="vec">纯矢量 Vector</option></select>
  </label>
  <label>时间 Time of day: <span id="tval">15:00</span><input id="time" type="range" min="0" max="24" step="0.25" value="15"></label>
  <label><input type="checkbox" id="L_buildings" checked> 建筑 Buildings</label>
  <label><input type="checkbox" id="L_roads" checked> 道路 Roads</label>
  <label><input type="checkbox" id="L_water" checked> 水体 Water</label>
  <label><input type="checkbox" id="L_trees" checked> 树木 Trees</label>
  <label><input type="checkbox" id="L_rails" checked> 铁路/地铁 Rail</label>
  <label><input type="checkbox" id="L_traffic" checked> 交通车流 Traffic</label>
  <label><input type="checkbox" id="L_poi" checked> 地标 Labels</label>
  <div style="margin-top:4px;opacity:.8">地标直达 Landmarks</div>
  <div class="qjump" id="qjump"></div>
  <input type="text" id="search" placeholder="搜索地名 Search…" />
  <div id="results"></div>
  <div id="stats" style="opacity:.75;margin-top:4px"></div>
  </div>
</div>
<div id="info"></div>
<div id="hint">左键旋转 · 右键平移 · 滚轮缩放 · 点击建筑查看信息 · <b>F</b> 第一人称 (WASD, Shift 加速, Esc 退出)</div>
<div id="attr">© OpenStreetMap contributors (ODbL) · GlobalBuildingAtlas (TUM) · Copernicus DEM · MapTiler Satellite</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
